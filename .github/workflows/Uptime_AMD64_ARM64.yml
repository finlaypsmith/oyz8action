name: 自动构建 Uptime Kuma (AMD64 & ARM64)

on:
  workflow_dispatch:
#  schedule:
#    - cron: '0 0 * * 0'

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Get latest version
        id: version
        run: |
          LATEST=$(curl -s https://api.github.com/repos/louislam/uptime-kuma/releases/latest | grep '"tag_name"' | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$LATEST" >> $GITHUB_OUTPUT
          echo "Latest version: $LATEST"
      
      - name: Check if release exists
        id: check
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          RELEASE=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/tags/$VERSION)
          
          if echo "$RELEASE" | grep -q "uptime-kuma-.*-amd64.tar.gz" && \
             echo "$RELEASE" | grep -q "uptime-kuma-.*-arm64.tar.gz"; then
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "Both architectures exist, skipping"
          else
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "Need to build"
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            image: node:20-bookworm
          - arch: arm64
            platform: linux/arm64
            image: arm64v8/node:20-bookworm
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      
      - name: Download Uptime Kuma source
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          echo "Downloading version: $VERSION"
          curl -sL "https://github.com/louislam/uptime-kuma/archive/refs/tags/${VERSION}.tar.gz" -o source.tar.gz
          tar -xzf source.tar.gz
          mv uptime-kuma-* uptime-kuma-src
          ls -la uptime-kuma-src/
      
      - name: Build in Docker
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          echo "Building $VERSION for $ARCH"
          
          docker run --rm --platform ${{ matrix.platform }} \
            -v "$PWD/uptime-kuma-src:/src:ro" \
            -v "$PWD/output:/output" \
            -e VERSION="$VERSION" \
            -e ARCH="$ARCH" \
            ${{ matrix.image }} bash -c '
              set -e
              echo "=== Building for $ARCH ==="
              echo "Architecture: $(uname -m)"
              echo "Node version: $(node -v)"
              echo "Version: $VERSION"
              
              # 安装编译依赖
              apt-get update
              apt-get install -y python3 build-essential g++ make
              
              # 复制源码
              cp -r /src /build
              cd /build
              
              # 构建前端
              echo "=== Installing all dependencies ==="
              npm ci --legacy-peer-deps
              
              echo "=== Building frontend ==="
              npm run build
              
              # 重新安装生产依赖并强制重新编译原生模块
              echo "=== Reinstalling production only ==="
              rm -rf node_modules
              npm ci --omit=dev --legacy-peer-deps
              
              # 强制重新编译 sqlite3
              echo "=== Rebuilding native modules ==="
              cd node_modules/@louislam/sqlite3
              npm run build-release
              cd /build
              
              # 验证 sqlite3 原生模块
              echo "=== Verifying sqlite3 binding ==="
              BINDING_PATH=$(find node_modules -name "node_sqlite3.node" -type f 2>/dev/null | head -1)
              
              if [ -z "$BINDING_PATH" ]; then
                echo "[ERROR] sqlite3 binding not found!"
                echo "Attempting manual rebuild..."
                
                # 尝试手动重建
                npm rebuild @louislam/sqlite3 --build-from-source
                
                BINDING_PATH=$(find node_modules -name "node_sqlite3.node" -type f 2>/dev/null | head -1)
                if [ -z "$BINDING_PATH" ]; then
                  echo "[FATAL] sqlite3 binding still not found after rebuild!"
                  exit 1
                fi
              fi
              
              echo "✓ Found sqlite3 binding: $BINDING_PATH"
              ls -la "$BINDING_PATH"
              file "$BINDING_PATH"
              
              # 验证架构匹配
              if [ "$ARCH" = "arm64" ]; then
                if ! file "$BINDING_PATH" | grep -q "aarch64\|ARM"; then
                  echo "[ERROR] Binding architecture mismatch!"
                  file "$BINDING_PATH"
                  exit 1
                fi
                echo "✓ Architecture verified: ARM64"
              else
                if ! file "$BINDING_PATH" | grep -q "x86-64\|x86_64"; then
                  echo "[ERROR] Binding architecture mismatch!"
                  file "$BINDING_PATH"
                  exit 1
                fi
                echo "✓ Architecture verified: AMD64"
              fi
              
              # 清理不需要的文件
              echo "=== Cleaning up ==="
              rm -rf .git .github .vscode test docker .devcontainer
              rm -f *.md CNAME compose.yaml .dockerignore .editorconfig .gitignore 2>/dev/null || true
              
              # 清理 node_modules（保留原生模块）
              find node_modules -name "*.md" -type f -delete 2>/dev/null || true
              find node_modules -name "*.map" -type f -delete 2>/dev/null || true
              find node_modules -name "LICENSE*" -type f -delete 2>/dev/null || true
              find node_modules -name "CHANGELOG*" -type f -delete 2>/dev/null || true
              find node_modules -type d -name "test" -exec rm -rf {} + 2>/dev/null || true
              find node_modules -type d -name "tests" -exec rm -rf {} + 2>/dev/null || true
              find node_modules -type d -name "docs" -exec rm -rf {} + 2>/dev/null || true
              find node_modules -type d -name ".github" -exec rm -rf {} + 2>/dev/null || true
              
              # 不要删除 .node 文件！
              echo "=== Preserving native modules ==="
              find node_modules -name "*.node" -type f | head -20
              
              # 显示大小
              echo "=== Final size ==="
              du -sh .
              du -sh node_modules
              
              # 最终验证
              echo "=== Final verification ==="
              FINAL_BINDING=$(find node_modules -name "node_sqlite3.node" -type f 2>/dev/null | head -1)
              if [ -z "$FINAL_BINDING" ]; then
                echo "[FATAL] sqlite3 binding lost during cleanup!"
                exit 1
              fi
              echo "✓ Final binding: $FINAL_BINDING"
              
              # 复制到输出目录
              mkdir -p /output
              cp -r /build /output/uptime-kuma
              
              echo "=== Done ==="
            '
      
      - name: Verify output
        run: |
          echo "=== Verifying output ==="
          BINDING=$(find output -name "node_sqlite3.node" -type f 2>/dev/null | head -1)
          if [ -z "$BINDING" ]; then
            echo "[ERROR] No sqlite3 binding in output!"
            find output -name "*.node" -type f
            exit 1
          fi
          echo "✓ Binding found: $BINDING"
          file "$BINDING"
      
      - name: Package
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          
          ls -la output/
          
          cd output
          tar -czvf "../uptime-kuma-${VERSION}-${ARCH}.tar.gz" uptime-kuma
          cd ..
          
          ls -lh *.tar.gz
          
          # 验证打包后的文件
          echo "=== Verifying package ==="
          tar -tzf "uptime-kuma-${VERSION}-${ARCH}.tar.gz" | grep "node_sqlite3.node" || echo "[WARN] Binding not in listing"
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: uptime-kuma-${{ matrix.arch }}
          path: uptime-kuma-*.tar.gz
          retention-days: 1

  release:
    needs: [check-version, build]
    runs-on: ubuntu-latest
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      
      - name: List files
        run: |
          find dist -type f -name "*.tar.gz"
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.check-version.outputs.version }}
          name: Uptime Kuma ${{ needs.check-version.outputs.version }}
          body: |
            Pre-built Uptime Kuma ${{ needs.check-version.outputs.version }}
            
            ## 📦 Downloads
            
            | Architecture | File |
            |-------------|------|
            | **AMD64** (x86_64, Intel/AMD) | `uptime-kuma-${{ needs.check-version.outputs.version }}-amd64.tar.gz` |
            | **ARM64** (aarch64, Apple Silicon, AWS Graviton) | `uptime-kuma-${{ needs.check-version.outputs.version }}-arm64.tar.gz` |
            
            ## ✅ Includes
            - Built frontend (dist/)
            - Server files
            - Production node_modules (架构特定)
            - Native sqlite3 bindings (已验证)
            
            ## 🚀 Usage
            ```bash
            curl -fsSL <download-url> | tar -xz
            cd uptime-kuma
            node server/server.js
