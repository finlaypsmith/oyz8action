name: 构建 Uptime Kuma ARM64

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 2.2.0，留空自动获取)'
        required: false
        default: ''

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            # 使用 jq 正确解析 JSON
            VERSION=$(curl -s https://api.github.com/repos/louislam/uptime-kuma/releases/latest | jq -r '.tag_name')
          fi
          
          # 验证版本号格式
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Error: Failed to get version"
            exit 1
          fi
          
          # 确保版本号看起来正确 (数字.数字.数字)
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Warning: Version '$VERSION' doesn't look like a version number"
            echo "Fetching manually..."
            VERSION=$(curl -s https://api.github.com/repos/louislam/uptime-kuma/releases/latest | jq -r '.tag_name')
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "========================================"
          echo "  Building Uptime Kuma v$VERSION"
          echo "========================================"
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      
      - name: Download source
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Downloading v$VERSION..."
          
          URL="https://github.com/louislam/uptime-kuma/archive/refs/tags/${VERSION}.tar.gz"
          echo "URL: $URL"
          
          curl -fSL "$URL" -o source.tar.gz
          
          # 验证下载
          if ! file source.tar.gz | grep -q gzip; then
            echo "Error: Downloaded file is not gzip"
            cat source.tar.gz | head -20
            exit 1
          fi
          
          tar -xzf source.tar.gz
          mv uptime-kuma-* uptime-kuma-src
          echo "✓ Source downloaded"
      
      - name: Build ARM64
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD/uptime-kuma-src:/src:ro" \
            -v "$PWD/output:/output" \
            -e VERSION="$VERSION" \
            arm64v8/node:20-bookworm bash -c '
              set -e
              
              echo "=========================================="
              echo "  ARM64 Build - Uptime Kuma $VERSION"
              echo "  Arch: $(uname -m)"
              echo "  Node: $(node -v)"
              echo "=========================================="
              
              apt-get update -qq
              apt-get install -y -qq python3 build-essential g++ make > /dev/null
              echo "✓ Build tools installed"
              
              cp -r /src /build
              cd /build
              
              echo ""
              echo "[1/5] Installing all dependencies..."
              npm ci --legacy-peer-deps 2>&1 | tail -5
              echo "✓ Dependencies installed"
              
              echo ""
              echo "[2/5] Building frontend..."
              npm run build 2>&1 | tail -5
              echo "✓ Frontend built"
              
              echo ""
              echo "[3/5] Reinstalling production deps..."
              rm -rf node_modules
              npm ci --omit=dev --legacy-peer-deps 2>&1 | tail -5
              echo "✓ Production deps installed"
              
              echo ""
              echo "[4/5] Rebuilding sqlite3 for ARM64..."
              npm rebuild @louislam/sqlite3 --build-from-source 2>&1 | tail -10 || true
              
              BINDING=$(find node_modules -name "node_sqlite3.node" -type f 2>/dev/null | head -1)
              
              if [ -z "$BINDING" ] || ! file "$BINDING" | grep -qi "aarch64\|ARM"; then
                echo "Trying node-pre-gyp..."
                cd node_modules/@louislam/sqlite3
                npx node-pre-gyp rebuild --build-from-source 2>&1 | tail -10 || true
                cd /build
              fi
              
              echo "✓ sqlite3 rebuilt"
              
              echo ""
              echo "[5/5] Verifying..."
              
              BINDING=$(find node_modules -name "node_sqlite3.node" -type f 2>/dev/null | head -1)
              
              if [ -z "$BINDING" ]; then
                echo "[ERROR] sqlite3 binding not found!"
                exit 1
              fi
              
              echo "Found: $BINDING"
              file "$BINDING"
              
              if ! file "$BINDING" | grep -qi "aarch64\|ARM"; then
                echo "[ERROR] Binding is not ARM64!"
                exit 1
              fi
              
              echo "✓ ARM64 binding verified"
              
              # 清理
              rm -rf .git .github test docker .devcontainer
              rm -f *.md CNAME compose.yaml 2>/dev/null || true
              
              FINAL=$(find node_modules -name "node_sqlite3.node" -type f 2>/dev/null | head -1)
              [ -z "$FINAL" ] && exit 1
              
              echo ""
              echo "=========================================="
              echo "  Build Complete!"
              echo "  Size: $(du -sh . | cut -f1)"
              echo "=========================================="
              
              mkdir -p /output
              cp -r /build /output/uptime-kuma
            '
      
      - name: Package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          
          BINDING=$(find output -name "node_sqlite3.node" -type f | head -1)
          echo "Binding: $BINDING"
          file "$BINDING"
          
          cd output
          tar -czf "../uptime-kuma-${VERSION}-arm64.tar.gz" uptime-kuma
          cd ..
          
          ls -lh *.tar.gz
      
      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          files: uptime-kuma-*-arm64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
