name: 构建 Uptime Kuma ARM64

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (留空自动获取)'
        required: false
        default: ''

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(curl -s https://api.github.com/repos/louislam/uptime-kuma/releases/latest | grep '"tag_name"' | sed -E 's/.*"([^"]+)".*/\1/')
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      
      - name: Download source
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          curl -sL "https://github.com/louislam/uptime-kuma/archive/refs/tags/${VERSION}.tar.gz" -o source.tar.gz
          tar -xzf source.tar.gz
          mv uptime-kuma-* uptime-kuma-src
      
      - name: Build ARM64
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD/uptime-kuma-src:/src:ro" \
            -v "$PWD/output:/output" \
            -e VERSION="$VERSION" \
            arm64v8/node:20-bookworm bash -c '
              set -e
              
              echo "=========================================="
              echo "  ARM64 Build"
              echo "  Arch: $(uname -m)"
              echo "  Node: $(node -v)"
              echo "=========================================="
              
              apt-get update -qq
              apt-get install -y -qq python3 build-essential g++ make > /dev/null
              echo "✓ Build tools installed"
              
              cp -r /src /build
              cd /build
              
              echo ""
              echo "[1/5] Installing all dependencies..."
              npm ci --legacy-peer-deps 2>&1 | tail -5
              echo "✓ Dependencies installed"
              
              echo ""
              echo "[2/5] Building frontend..."
              npm run build 2>&1 | tail -5
              echo "✓ Frontend built"
              
              echo ""
              echo "[3/5] Reinstalling production deps..."
              rm -rf node_modules
              npm ci --omit=dev --legacy-peer-deps 2>&1 | tail -5
              echo "✓ Production deps installed"
              
              echo ""
              echo "[4/5] Rebuilding sqlite3 for ARM64..."
              
              # 方法1: npm rebuild
              npm rebuild @louislam/sqlite3 --build-from-source 2>&1 | tail -10 || true
              
              # 检查是否成功
              BINDING=$(find node_modules -name "node_sqlite3.node" -type f 2>/dev/null | head -1)
              
              # 方法2: 如果失败，尝试 node-pre-gyp
              if [ -z "$BINDING" ] || ! file "$BINDING" | grep -qi "aarch64\|ARM"; then
                echo "Trying node-pre-gyp..."
                cd node_modules/@louislam/sqlite3
                npx node-pre-gyp rebuild --build-from-source 2>&1 | tail -10 || true
                cd /build
              fi
              
              # 方法3: 直接用 node-gyp
              BINDING=$(find node_modules -name "node_sqlite3.node" -type f 2>/dev/null | head -1)
              if [ -z "$BINDING" ] || ! file "$BINDING" | grep -qi "aarch64\|ARM"; then
                echo "Trying node-gyp directly..."
                cd node_modules/@louislam/sqlite3
                npx node-gyp rebuild 2>&1 | tail -10 || true
                cd /build
              fi
              
              echo "✓ sqlite3 rebuild attempted"
              
              echo ""
              echo "[5/5] Verifying..."
              
              BINDING=$(find node_modules -name "node_sqlite3.node" -type f 2>/dev/null | head -1)
              
              if [ -z "$BINDING" ]; then
                echo "[ERROR] sqlite3 binding not found!"
                echo "Searching for any .node files:"
                find node_modules -name "*.node" -type f 2>/dev/null || echo "None found"
                exit 1
              fi
              
              echo "Found: $BINDING"
              file "$BINDING"
              
              if ! file "$BINDING" | grep -qi "aarch64\|ARM"; then
                echo "[ERROR] Binding is not ARM64!"
                file "$BINDING"
                exit 1
              fi
              
              echo "✓ ARM64 binding verified"
              
              # 清理
              echo ""
              echo "Cleaning up..."
              rm -rf .git .github test docker .devcontainer
              rm -f *.md CNAME compose.yaml 2>/dev/null || true
              find node_modules \( -name "*.md" -o -name "*.map" \) -delete 2>/dev/null || true
              find node_modules -type d \( -name "test" -o -name "tests" -o -name "docs" \) -exec rm -rf {} + 2>/dev/null || true
              
              # 再次验证 binding 还在
              FINAL=$(find node_modules -name "node_sqlite3.node" -type f 2>/dev/null | head -1)
              if [ -z "$FINAL" ]; then
                echo "[FATAL] Binding was deleted during cleanup!"
                exit 1
              fi
              
              echo ""
              echo "=========================================="
              echo "  Build Complete!"
              echo "  Size: $(du -sh . | cut -f1)"
              echo "  Binding: $FINAL"
              echo "=========================================="
              
              mkdir -p /output
              cp -r /build /output/uptime-kuma
            '
      
      - name: Package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          
          BINDING=$(find output -name "node_sqlite3.node" -type f | head -1)
          echo "Final binding: $BINDING"
          file "$BINDING"
          
          cd output
          tar -czf "../uptime-kuma-${VERSION}-arm64.tar.gz" uptime-kuma
          cd ..
          
          echo ""
          echo "Package: uptime-kuma-${VERSION}-arm64.tar.gz"
          ls -lh *.tar.gz
      
      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          files: uptime-kuma-*-arm64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
